name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm test
        env:
          NODE_ENV: test
          CONFIG_ENC_KEY: dGVzdC1rZXktMzItYnl0ZXMtbG9uZy1lbm91Z2g=